version: 2.1
jobs:
  db_targetplatform:
    docker:
      - image: cimg/openjdk:17.0
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    working_directory: ~/repo
    environment:
      JVM_OPTS: -Xmx1000m
      TERM: dumb
      ANT_VERSION: apache-ant-1.10.18
      ANT_HOME: /opt/apache-ant-1.10.18
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-repo-targetplatform-{{ .Branch }}-{{ checksum "maven-cache-version" }}

      - run:
          name: Install Maven (latest 3.9.x version)
          command: |
            # The latest Maven version 3.10.x gives problems with Tycho 4.0.9
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/maven.tar.gz

            sudo mv -f /opt/apache-maven /opt/apache-maven.original
            sudo mkdir /opt/apache-maven
            sudo tar -xzf /tmp/maven.tar.gz -C /opt/apache-maven --strip-components=1

            /opt/apache-maven/bin/mvn -v

      # Install Ant manually from Apache
      - run:
          name: Install Ant manually
          command: |
            sudo apt-get update
            sudo apt-get install -y wget

            # More ant binaries can be found at https://archive.apache.org/dist/ant/binaries/
            wget https://downloads.apache.org/ant/binaries/$ANT_VERSION-bin.tar.gz

            sudo tar -xzf $ANT_VERSION-bin.tar.gz -C /opt/
            sudo ln -s $ANT_HOME /opt/ant
            sudo ln -sfn /opt/ant/bin/ant /usr/bin/ant

            rm -f $ANT_VERSION-bin.tar.gz

      - run:
          name: Run Ant createtargetplatform
          command: |
            ant targetplatform -Dversion="${MINORTAG}.${CIRCLE_BUILD_NUM}"

            cd targetplatform
            mvn -s "../.circleci/conf/settings.xml" install -B -U -ff
            cd ..

      - run:
          name: Upload(scp) thirdparty P2 Environment to repo.dexels.com
          command: |
            SUFFIX=`[[ $CIRCLE_BRANCH = "main" ]] && echo "" || echo "-$CIRCLE_BRANCH"`
            echo "Using suffix $SUFFIX"

            ssh -o StrictHostKeyChecking=no dexelsbutler@repo.dexels.com "mkdir -p /var/www/html/repo/eclipse/3rdparty_${MINORTAG}.${CIRCLE_BUILD_NUM}${SUFFIX}/"
            scp -r targetplatform/target/repository/* dexelsbutler@repo.dexels.com:/var/www/html/repo/eclipse/3rdparty_${MINORTAG}.${CIRCLE_BUILD_NUM}${SUFFIX}

      - save_cache:
          paths:
            - ~/.m2
          key: maven-repo-targetplatform-{{ .Branch }}-{{ checksum "maven-cache-version" }}

      - run:
          name: Check GitHub token works and configure git credentials
          command: |
            if [ -z "${GITHUB_PERSONAL_TOKEN}" ]; then
              echo "GITHUB_PERSONAL_TOKEN is empty - check project env vars / context"
              exit 1
            fi

            # Strip any stray whitespace/newline that crept into the env var value.
            TOKEN=$(printf '%s' "${GITHUB_PERSONAL_TOKEN}" | tr -d '[:space:]')
            echo "token length ${#GITHUB_PERSONAL_TOKEN} (${#TOKEN} after trimming whitespace)"

            # Prove the token grants access, instead of only that it is set.
            #   200 = ok
            #   401 = invalid or expired token
            #   404 = token has no access to that repo: missing 'repo' scope, a
            #         fine-grained token without the repo selected, or a classic
            #         token not SSO-authorized for the Sendrato org
            fail=0

            repo=Sendrato/navajo
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}")
            echo "${repo}: HTTP ${code}"
            [ "${code}" = "200" ] || fail=1

            if [ "${fail}" != "0" ]; then
              echo "GITHUB_PERSONAL_TOKEN does not grant access to every target repo."
              exit 1
            fi

            # Hand the token to git through a credential helper instead of embedding it
            # in the clone/push URL. Helper credentials are keyed on the host, so they
            # survive the redirect that drops the user info out of a
            # https://TOKEN@github.com/... URL -- that redirect is what left git with no
            # username and made it prompt for one.
            git config --global credential.helper store

            printf 'https://x-access-token:%s@github.com\n' "${TOKEN}" > ~/.git-credentials
            chmod 600 ~/.git-credentials

            # CircleCI's checkout step installs a global URL rewrite that turns
            # https://github.com/... into ssh://git@github.com/..., which sends these
            # clones over ssh with navajo's checkout key instead of over https with the
            # token -- and that key has no access to the target repos, so the clone dies
            # with "ERROR: Repository not found". The original URLs were not rewritten
            # only because the token in them stopped the prefix from matching.
            echo "--- global git config before ---"
            git config --global --list || true

            for name in $(git config --global --name-only --get-regexp 'url\..*\.insteadof' 2>/dev/null || true); do
              case "${name}" in
                *github.com*) echo "removing URL rewrite: ${name}"; git config --global --unset-all "${name}" ;;
              esac
            done

            echo "--- global git config after ---"
            git config --global --list || true

            # Confirm the rewrite is gone and the token really can fetch over https,
            # before any step starts committing.
            repo=navajo
            url=$(git ls-remote --get-url "https://github.com/Sendrato/${repo}.git")
            case "${url}" in
              https://github.com/*) : ;;
              *) echo "https URL is still being rewritten to ${url}"; exit 1 ;;
            esac
            echo "ls-remote Sendrato/${repo}"
            git ls-remote --heads "https://github.com/Sendrato/${repo}.git" >/dev/null

      - run:
          name: Update navajo dependency on dexels-base to latest dexels-base build version (Triggers CI build on navajo)
          command: |
            mkdir ~/navajocheckout
            cd ~/navajocheckout

            git clone https://${GITHUB_PERSONAL_TOKEN}@github.com/Sendrato/navajo.git -b "$CIRCLE_BRANCH" --depth 1

            ls -l
            cd navajo/setup/com.dexels.navajo.target

            DEXELS_BASE_BRANCH="${CIRCLE_BRANCH}" DEXELS_BASE_BUILD="${CIRCLE_BUILD_NUM}" ./updateversion.sh

            # Push changes
            git config credential.helper 'cache --timeout=120'
            git config user.email "Dexels Butler"
            git config user.name "butler@dexels.com"
            git add .

            echo "Committing changes"

            git commit --allow-empty -m "Update via CircleCI"
            git push -q https://${GITHUB_PERSONAL_TOKEN}@github.com/Sendrato/navajo.git $CIRCLE_BRANCH
            echo "Push complete"

  db_docker:
    docker:
      - image: cimg/openjdk:17.0
        auth:
          username: $DOCKERHUB_USER
          password: $DOCKERHUB_PASS
    working_directory: ~/repo
    environment:
      JVM_OPTS: -Xmx1000m
      TERM: dumb
      ANT_VERSION: apache-ant-1.10.18
      ANT_HOME: /opt/apache-ant-1.10.18
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-repo-v1-{{ .Branch }}-{{ checksum "maven-cache-version" }}

      - run:
          name: Install Maven (latest 3.9.x version)
          command: |
            # The latest Maven version 3.10.x gives problems with Tycho 4.0.9
            curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o /tmp/maven.tar.gz

            sudo mv -f /opt/apache-maven /opt/apache-maven.original
            sudo mkdir /opt/apache-maven
            sudo tar -xzf /tmp/maven.tar.gz -C /opt/apache-maven --strip-components=1

            /opt/apache-maven/bin/mvn -v

      # Install Ant manually from Apache
      - run:
          name: Install Ant manually
          command: |
            sudo apt-get update
            sudo apt-get install -y wget

            # More ant binaries can be found at https://archive.apache.org/dist/ant/binaries/
            wget https://downloads.apache.org/ant/binaries/$ANT_VERSION-bin.tar.gz

            sudo tar -xzf $ANT_VERSION-bin.tar.gz -C /opt/
            sudo ln -sfn $ANT_HOME /opt/ant
            sudo ln -sfn /opt/ant/bin/ant /usr/bin/ant

            rm -f $ANT_VERSION-bin.tar.gz

      - run:
          # TODO cleanup antfiles remove all unneeded targets
          name: Runt Ant alldistros (dockersetup)
          command: |
            ant alldistros -Ddocker=false -Dupload=false -Dbundles=core.cfg -Dversion=${MINORTAG}.${CIRCLE_BUILD_NUM} -debug
            ls -l target

      - store_artifacts:
          path: ~/repo/target/dexels-base.tar.gz
          destination: dexels-base.tgz

      - save_cache:
          paths:
            - ~/.m2
          key: maven-repo-v1-{{ .Branch }}-{{ checksum "maven-cache-version" }}

      # See https://circleci.com/docs/2.0/building-docker-images/
      - setup_remote_docker

      - run:
          name: Log in with docker registries
          command: |
            docker --version
            echo $DOCKERHUB_PASS | docker login --username $DOCKERHUB_USER --password-stdin

      - run:
          name: Docker build and push dexels-base image
          command: |
            TAGSUFFIX=`[[ $CIRCLE_BRANCH = "main" ]] && echo "" || echo "-${CIRCLE_BRANCH}"`
            TAG=${MINORTAG}.${CIRCLE_BUILD_NUM}${TAGSUFFIX}
            echo "Building tag: $TAG"

            cd ~/repo
            ls -lR

            export GIT_REMOTE=$(git config --get remote.origin.url)
            export GIT_COMMIT=$(git rev-parse HEAD)
            echo "Adding remote: ${GIT_REMOTE} and commit: ${GIT_COMMIT}"

            IMAGE=dexels/dexels-base

            docker build --build-arg DEXELS_BASE_COMMIT=${GIT_COMMIT} --build-arg DEXELS_BASE_REMOTE=${GIT_REMOTE} -t ${IMAGE}:$TAG temp
            docker push ${IMAGE}:$TAG

            if [ $CIRCLE_BRANCH = "main" ]; then
              docker tag ${IMAGE}:$TAG ${IMAGE}:latest
              docker push ${IMAGE}:latest
            fi

workflows:
  version: 2
  main:
    jobs:
    - db_targetplatform:
        context:
        - dexels_docker_hub
        filters:
          branches:
            only:
            - main
            - test

    - db_docker:
        context:
        - dexels_docker_hub
        filters:
          branches:
            only:
            - main
            - test
